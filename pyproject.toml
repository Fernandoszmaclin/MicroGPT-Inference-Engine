[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "microgpt-inference-engine"
version = "0.1.0"
description = "A small GPT inference engine with a NumPy reference implementation"
requires-python = ">=3.11"
dependencies = ["numpy>=2.3,<3"]

[project.scripts]
microgpt = "microgpt.cli:main"

[tool.setuptools.packages.find]
include = ["microgpt"]

[tool.setuptools.package-data]
microgpt = ["attention.c"]
